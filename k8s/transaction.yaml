apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: txn
  template:
    metadata:
      labels:
        app: txn
    spec:
      containers:
      - name: txn
        image: 123456789.dkr.ecr.us-east-1.amazonaws.com/transaction-service:latest
        ports:
        - containerPort: 4003
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
spec:
  selector:
    app: txn
  ports:
    - port: 4003
      targetPort: 4003