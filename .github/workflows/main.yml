name: CI/CD to EKS (ECR)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # 🔐 AWS Login
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET }}
          aws-region: us-east-1

      # 🔐 Login to ECR
      - name: Login to ECR
        run: |
          aws ecr get-login-password --region us-east-1 | \
          docker login --username AWS --password-stdin ${{ secrets.ECR_URI }}

      # 🐳 Build & Push Images
      - name: Build & Push
        run: |
          docker build -t auth-service ./auth-service
          docker tag auth-service ${{ secrets.ECR_URI }}/auth-service:latest
          docker push ${{ secrets.ECR_URI }}/auth-service:latest

          docker build -t account-service ./account-service
          docker tag account-service ${{ secrets.ECR_URI }}/account-service:latest
          docker push ${{ secrets.ECR_URI }}/account-service:latest

          docker build -t transaction-service ./transaction-service
          docker tag transaction-service ${{ secrets.ECR_URI }}/transaction-service:latest
          docker push ${{ secrets.ECR_URI }}/transaction-service:latest

          docker build -t api-gateway ./api-gateway
          docker tag api-gateway ${{ secrets.ECR_URI }}/api-gateway:latest
          docker push ${{ secrets.ECR_URI }}/api-gateway:latest

      # ☸️ Connect to EKS
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name banking-cluster

      # 🚀 Deploy
      - name: Deploy to EKS
        run: kubectl apply -f k8s/
